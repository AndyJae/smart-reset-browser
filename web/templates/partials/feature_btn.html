<button id="feature-{{ key }}"
        class="btn btn-feature {{ 'push-right' if key == 'osd' else '' }} {{ 'active' if enabled else '' }}"
        hx-post="/api/camera/feature/{{ key }}"
        hx-vals='{"enabled": "{{ 'false' if enabled else 'true' }}"}'
        hx-target="#feature-{{ key }}"
        hx-swap="outerHTML">
  {{ 'OSD' if key == 'osd' else (key | replace('_', ' ') | title) }} {{ 'ON' if enabled else 'OFF' }}
</button>
